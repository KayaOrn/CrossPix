name: Build and Deploy CrossPix Photo Wall

on:
  push:
    branches: [ "kaya-frica-web" ] 
  workflow_dispatch: 

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      - name: Run generate.py
        run: python generate.py
        
#      - name: Auto update Service Worker version
#        run: |
#          # Generate a unique version number based on a timestamp
#          BUILD_VERSION=$(date +%s)
#          
#          # replace `__VERSION__` in `sw.js` with timestamp
#          sed -i "s/__VERSION__/$BUILD_VERSION/g" sw.js
#          
#          echo "✅ Service Worker version has been automatically updated to v$BUILD_VERSION"

      - name: Debug and Update Service Worker version
        run: |
          echo "1. ls -la"
          ls -la
          
          echo "2. cat sw.js"
          cat sw.js
          
          # sed
          BUILD_VERSION=$(date +%s)
          echo "生成的版本号: $BUILD_VERSION"
          sed -i "s/__VERSION__/$BUILD_VERSION/g" sw.js
          
          echo "3. cat sw.js"
          cat sw.js
          
          echo "4. git diff"
          git diff sw.js

      - name: Auto-commit generated data.json and thumbnails back to repo
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Auto-generate thumbnails and data.json via GitHub Actions"
          file_pattern: "data.json thumbnails/"
      
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact for deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' 

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4