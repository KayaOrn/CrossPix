name: Build and Deploy CrossPix Photo Wall

on:
#  push:
#    branches: [ "kaya-frica-web" ] 
  workflow_dispatch: 

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      - name: Run generate.py
        run: python generate.py
        
      - name: Update Service Worker version
        run: |          
          # sed
          BUILD_VERSION=$(date +%s)
          echo " Generate a unique version number based on a timestamp $BUILD_VERSION"
          sed -i "s/__VERSION__/$BUILD_VERSION/g" sw.js

          echo "Check build version (git diff)："
          git diff sw.js
          echo "✅ Service Worker version has been automatically updated to v$BUILD_VERSION"

      - name: Auto-commit generated data.json, thumbnails and sw.js back to repo
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Auto-generate thumbnails, data.json and update sw.js version via GitHub Actions"
          file_pattern: "data.json thumbnails/ sw.js"
      
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact for deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' 

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4